# Vidify default configuration
# Place this file at ~/.vidify.yaml or in the project root.
# All values can be overridden by CLI flags or VIDIFY_* environment variables.
# Priority: CLI flags > environment variables > this file > built-in defaults.

# ============================================================
# Processing parameters
# ============================================================

# Whisper model: tiny | base | small | medium | large
model: medium

# Language for transcription: "auto" for auto-detect, or BCP-47 code (en, zh, ja)
language: auto

# Enable translation mode (translate non-English to English)
translate: false

# Background image path (empty = built-in default)
bg-image: ""

# Output directory (empty = current directory)
output: ""

# ============================================================
# Logging configuration
# ============================================================

log:
  # Directory for log files. Empty = ~/.vidify/logs (created automatically).
  dir: " "

  # Minimum log level written to both console and file.
  # Accepted values: debug | info | warn | error
  level: info

  # Write a JSON-formatted log file in addition to console (Text) output.
  # Set to false for pipe-friendly or CI environments.
  to-file: true

  # Number of old rotated log files to retain (oldest are deleted first).
  max-backups: 7

  # Maximum age in days before a log file is deleted.
  max-age: 30

  # Maximum size in megabytes before the active log file is rotated.
  max-size: 100

# ============================================================
# Advanced: binary path overrides (leave empty for auto-detect)
# ============================================================
# By default Vidify finds whisper-cli and ffmpeg from:
#   1. These config keys (highest priority)
#   2. runtime-tools/<tool>/<platform>/ next to the vidify binary (bundled release)
#   3. System PATH (fallback)
# Only set these if you need a specific binary instead of the bundled one.

# whisper-bin: ""
# whisper-model-dir: ""
# ffmpeg-bin: ""

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidify 处理链路与开发状态</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --paper-2: #ececec;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #5a6580;
      --rule: rgba(45,49,66,.14);
      --accent: #bf4520;
      --accent-tint: rgba(191,69,32,.08);
      --sans: 'Geist','Noto Sans SC',system-ui,sans-serif;
      --serif: 'Instrument Serif','Noto Serif',serif;
      --mono: 'Geist Mono',ui-monospace,monospace;
    }
    body { background:var(--paper); color:var(--ink); font-family:var(--sans); padding:40px 24px; }
    main { max-width:1280px; margin:0 auto; }
    .eyebrow { color:var(--muted); font:500 11px var(--mono); letter-spacing:.16em; text-transform:uppercase; margin-bottom:10px; }
    h1 { font:400 clamp(30px,4vw,44px)/1.1 var(--serif); margin-bottom:10px; }
    .intro { color:var(--muted); font-size:15px; line-height:1.7; max-width:850px; margin-bottom:24px; }
    .diagram-container { width:100%; overflow-x:auto; border:1px solid var(--rule); background:#fff; }
    svg { width:100%; min-width:1280px; display:block; }
    .caption { display:flex; flex-wrap:wrap; gap:12px 28px; justify-content:space-between; border-top:1px solid var(--rule); padding:16px 18px; color:var(--muted); font-size:13px; line-height:1.6; }
    .caption strong { color:var(--ink); font-weight:600; }
    @media print { body { padding:0; } .diagram-container { overflow-x:visible; } svg { min-width:0; } }
  </style>
</head>
<body>
<main>
  <p class="eyebrow">VIDIFY · PIPELINE AND MVP STATUS</p>
  <h1>从本地音频到字幕视频</h1>
  <p class="intro">当前已接通转录、字幕分页、视频渲染和产物发布。图中展示处理链路；任务基础与发布保护仍有待补齐的能力，完整 MVP 尚未完成。当前行为和验证范围见 <a href="cli-contract.md">CLI 契约</a>，目标与取舍见 <a href="adr/0001-mvp-product-and-pipeline.md">ADR 0001</a>。</p>
  <div class="diagram-container">
    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vidify-roadmap-title vidify-roadmap-desc">
      <title id="vidify-roadmap-title">Vidify 处理链路与开发状态</title>
      <desc id="vidify-roadmap-desc">处理链路已接通 process 命令、任务基础、音频转换、转录、SRT、ASS 排版、MP4 渲染和发布。任务基础仍缺目录锁、日志和应用工作区；发布依赖硬链接，清理警告仍待实现。图中节点是职责概览，与任务状态中的六个阶段不逐一对应。</desc>
      <defs>
        <marker id="roadmap-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="roadmap-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
      </defs>
      <rect width="1280" height="720" fill="#f5f5f5"/>
      <text x="72" y="64" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="11" letter-spacing="2">PROCESSING FLOW · 8 STEPS</text>
      <text x="1208" y="64" text-anchor="end" fill="#5a6580" font-family="'Geist Mono',monospace" font-size="11">MVP · ONE LOCAL AUDIO FILE</text>

      <!-- Flow connectors: top row left-to-right, then bottom row right-to-left. -->
      <path d="M312 232 H368" fill="none" stroke="#bf4520" stroke-width="2" marker-end="url(#roadmap-arrow-accent)"/>
      <path d="M608 232 H664" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#roadmap-arrow)"/>
      <path d="M904 232 H960" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#roadmap-arrow)"/>
      <path d="M1080 322 V418" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#roadmap-arrow)"/>
      <path d="M960 508 H904" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#roadmap-arrow)"/>
      <path d="M664 508 H608" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#roadmap-arrow)"/>
      <path d="M368 508 H312" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#roadmap-arrow)"/>

      <!-- Stage 1 -->
      <g font-family="'Geist','Noto Sans SC',sans-serif">
        <rect x="72" y="142" width="240" height="180" rx="6" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="1.5"/>
        <text x="92" y="170" fill="#bf4520" font-family="'Geist Mono',monospace" font-size="11" letter-spacing="1">01 · CLI ENTRY</text>
        <text x="92" y="202" fill="#2d3142" font-size="19" font-weight="600">process 命令入口</text>
        <text x="92" y="232" fill="#4f5d75" font-size="13">单个音频、model 与 output-dir</text>
        <text x="92" y="253" fill="#4f5d75" font-size="13">检查参数与依赖，给出清楚错误</text>
        <line x1="92" y1="274" x2="292" y2="274" stroke="rgba(45,49,66,.14)"/>
        <text x="92" y="299" fill="#2d3142" font-size="12" font-weight="600">产物：可调用的 CLI 契约</text>
      </g>

      <!-- Stage 2 -->
      <g font-family="'Geist','Noto Sans SC',sans-serif">
        <rect x="368" y="142" width="240" height="180" rx="6" fill="#fff" stroke="rgba(45,49,66,.28)"/>
        <text x="388" y="170" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="11" letter-spacing="1">02 · TASK · PARTIAL</text>
        <text x="388" y="202" fill="#2d3142" font-size="19" font-weight="600">任务基础：部分实现</text>
        <text x="388" y="232" fill="#4f5d75" font-size="13">已有阶段状态、取消与进程调用</text>
        <text x="388" y="253" fill="#4f5d75" font-size="13">待补目录锁、日志与应用工作区</text>
        <line x1="388" y1="274" x2="588" y2="274" stroke="rgba(45,49,66,.14)"/>
        <text x="388" y="299" fill="#2d3142" font-size="12" font-weight="600">已有：进程内线性任务状态</text>
      </g>

      <!-- Stage 3 -->
      <g font-family="'Geist','Noto Sans SC',sans-serif">
        <rect x="664" y="142" width="240" height="180" rx="6" fill="#fff" stroke="rgba(45,49,66,.28)"/>
        <text x="684" y="170" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="11" letter-spacing="1">03 · AUDIO</text>
        <text x="684" y="202" fill="#2d3142" font-size="19" font-weight="600">校验并规范化音频</text>
        <text x="684" y="232" fill="#4f5d75" font-size="13">探测音频流与时长，再解码</text>
        <text x="684" y="253" fill="#4f5d75" font-size="13">FFmpeg 转 16 kHz / mono / PCM WAV</text>
        <line x1="684" y1="274" x2="884" y2="274" stroke="rgba(45,49,66,.14)"/>
        <text x="684" y="299" fill="#2d3142" font-size="12" font-weight="600">产物：标准化 WAV</text>
      </g>

      <!-- Stage 4 -->
      <g font-family="'Geist','Noto Sans SC',sans-serif">
        <rect x="960" y="142" width="240" height="180" rx="6" fill="#fff" stroke="rgba(45,49,66,.28)"/>
        <text x="980" y="170" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="11" letter-spacing="1">04 · TRANSCRIPTION</text>
        <text x="980" y="202" fill="#2d3142" font-size="19" font-weight="600">接入 whisper.cpp</text>
        <text x="980" y="232" fill="#4f5d75" font-size="13">解析带真实时间戳的转录结果</text>
        <text x="980" y="253" fill="#4f5d75" font-size="13">校验 Segment 区间与文本</text>
        <line x1="980" y1="274" x2="1180" y2="274" stroke="rgba(45,49,66,.14)"/>
        <text x="980" y="299" fill="#2d3142" font-size="12" font-weight="600">产物：有效 Segment 列表</text>
      </g>

      <!-- Stage 5 -->
      <g font-family="'Geist','Noto Sans SC',sans-serif">
        <rect x="960" y="418" width="240" height="180" rx="6" fill="#fff" stroke="rgba(45,49,66,.28)"/>
        <text x="980" y="446" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="11" letter-spacing="1">05 · SUBTITLES</text>
        <text x="980" y="478" fill="#2d3142" font-size="19" font-weight="600">生成 SRT 字幕</text>
        <text x="980" y="508" fill="#4f5d75" font-size="13">按原始 Segment 时间生成字幕</text>
        <text x="980" y="529" fill="#4f5d75" font-size="13">保留毫秒区间，不随翻页延长</text>
        <line x1="980" y1="550" x2="1180" y2="550" stroke="rgba(45,49,66,.14)"/>
        <text x="980" y="575" fill="#2d3142" font-size="12" font-weight="600">产物：标准 SRT 文件</text>
      </g>

      <!-- Stage 6 -->
      <g font-family="'Geist','Noto Sans SC',sans-serif">
        <rect x="664" y="418" width="240" height="180" rx="6" fill="#fff" stroke="rgba(45,49,66,.28)"/>
        <text x="684" y="446" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="11" letter-spacing="1">06 · LAYOUT</text>
        <text x="684" y="478" fill="#2d3142" font-size="19" font-weight="600">排版分页并生成 ASS</text>
        <text x="684" y="508" fill="#4f5d75" font-size="13">按实际可用区域测量页面容量</text>
        <text x="684" y="529" fill="#4f5d75" font-size="13">整段分页，计算逐步累积显示</text>
        <line x1="684" y1="550" x2="884" y2="550" stroke="rgba(45,49,66,.14)"/>
        <text x="684" y="575" fill="#2d3142" font-size="12" font-weight="600">产物：可读、同步的 ASS</text>
      </g>

      <!-- Stage 7 -->
      <g font-family="'Geist','Noto Sans SC',sans-serif">
        <rect x="368" y="418" width="240" height="180" rx="6" fill="#fff" stroke="rgba(45,49,66,.28)"/>
        <text x="388" y="446" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="11" letter-spacing="1">07 · VIDEO</text>
        <text x="388" y="478" fill="#2d3142" font-size="19" font-weight="600">渲染并核对 MP4</text>
        <text x="388" y="508" fill="#4f5d75" font-size="13">FFmpeg + libass：H.264 / AAC</text>
        <text x="388" y="529" fill="#4f5d75" font-size="13">1920×1080、30 fps，音轨重编码</text>
        <line x1="388" y1="550" x2="588" y2="550" stroke="rgba(45,49,66,.14)"/>
        <text x="388" y="575" fill="#2d3142" font-size="12" font-weight="600">产物：可播放且同步的 MP4</text>
      </g>

      <!-- Stage 8 -->
      <g font-family="'Geist','Noto Sans SC',sans-serif">
        <rect x="72" y="418" width="240" height="180" rx="6" fill="#fff" stroke="rgba(45,49,66,.28)"/>
        <text x="92" y="446" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="11" letter-spacing="1">08 · PUBLISH · PARTIAL</text>
        <text x="92" y="478" fill="#2d3142" font-size="19" font-weight="600">验证后再发布</text>
        <text x="92" y="508" fill="#4f5d75" font-size="13">硬链接发布，默认拒绝覆盖</text>
        <text x="92" y="529" fill="#4f5d75" font-size="13">先 SRT 后 MP4，待补清理警告</text>
        <line x1="92" y1="550" x2="292" y2="550" stroke="rgba(45,49,66,.14)"/>
        <text x="92" y="575" fill="#2d3142" font-size="12" font-weight="600">成功条件：两份产物均已发布</text>
      </g>

      <line x1="72" y1="636" x2="1208" y2="636" stroke="rgba(45,49,66,.16)"/>
      <text x="72" y="664" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="11" letter-spacing="1">CURRENT BASELINE</text>
      <text x="268" y="664" fill="#2d3142" font-family="'Geist','Noto Sans SC',sans-serif" font-size="13">端到端链路与短样本验收已完成；可靠性能力与最终样式仍待补齐。</text>
      <text x="72" y="692" fill="#5a6580" font-family="'Geist','Noto Sans SC',sans-serif" font-size="12">待验证：更多编码与长音频、字体覆盖、whisper.cpp 兼容范围，以及跨平台发布行为。</text>
    </svg>
  </div>
  <div class="caption">
    <span><strong>当前重点：</strong>输出目录锁、临时工作区、清理警告、阶段进度和日志。</span>
    <span><strong>验收终点：</strong>MP4 与 SRT 均已验证并发布；完整要求见 <a href="adr/0001-mvp-product-and-pipeline.md">ADR 0001</a>。</span>
  </div>
</main>
</body>
</html>
